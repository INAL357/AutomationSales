server:
  port: ${PORT:8080}

spring:
  application:
    name: AutomationSales

  # Locally falls back to localhost. On Render, DB_* variables are set automatically.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:automationDB}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: inalmendonca2@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ---------------- Security / JWT ----------------
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
    issuer: AutomationSales

  security:
    # First ADMIN is created on startup only if the users table is empty
    bootstrap-admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      full-name: Administrator

# ---------------- Renewal automation ----------------
  renewal:
    reminder-days: 90,60,30,14,7
    expiring-soon-days: 90
    task-due-in-days: 3
    scheduler-cron: "0 0 8 * * *"